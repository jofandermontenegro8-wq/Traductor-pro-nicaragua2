        function procesarTraduccion() {
            const palabra = document.getElementById('inputPalabra').value.toLowerCase().trim();
            const displayResultado = document.getElementById('textoResultado');
            const contenedor = document.getElementById('resultadoContenedor');

            if (diccionario[palabra]) {
                const traduccion = diccionario[palabra];
                displayResultado.innerText = traduccion;
                contenedor.classList.remove('hidden');
                
                // Función de voz automática
                hablar(traduccion);
            } else {
                displayResultado.innerText = "No encontrada";
                contenedor.classList.remove('hidden');
            }
        }

        function hablar(texto) {
            // Cancela cualquier voz anterior para que no se amontonen
            window.speechSynthesis.cancel();
            
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'en-US'; // Voz en Inglés de Estados Unidos
            mensaje.rate = 0.8;    // Velocidad (1 es normal, 0.8 es un poquito más lento)
            mensaje.pitch = 1;     // Tono de voz
            window.speechSynthesis.speak(mensaje);
        }

        // Permite traducir al presionar "Enter" en el teclado
        document.getElementById('inputPalabra').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                procesarTraduccion();
            }
        });
    </script>
